name: Workspace quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: laundry_test
          POSTGRES_PASSWORD: isolated_ci_test_only
          POSTGRES_DB: laundry_operations_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://laundry_test:isolated_ci_test_only@localhost:5432/laundry_operations_test
      TEST_DATABASE_URL: postgresql://laundry_test:isolated_ci_test_only@localhost:5432/laundry_operations_test
      APP_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate -w @shree/operations
      - run: npm run check
      - run: npm run test:integration
      - run: npm audit --omit=dev
